# Who may judge and who may author, for this repository.
#
# Read by `rung-driver`. Two rules govern everything here and neither is
# enforced by this file — both are enforced when a dispatch is attempted:
#
#   judgmental  capable(p, role) AND pi(p) disjoint from what is judged
#   authorial   capable(p, role) AND standing over the container written to
#
# So `authored` is not bookkeeping. It is the list that disqualifies a
# principal from ruling on its own work, and understating it is how P0 becomes
# decorative.
#
# `capabilities` is the ONLY thing the competence filter reads. `kind` is
# recorded and never filtered on: a model that can edit files fills a role
# needing `file-editing`, and an agent that never declared `structured-outputs`
# does not fill one needing it.

# Where models are served from. A population routinely spans several: two
# judges from different families is the point of having two, and different
# families are different endpoints with different credentials.
#
# NO SECRET LIVES HERE. A provider names the environment variable its
# credential is read from, never the credential. This file is in the
# repository, and a schema with an `api_key` field is an invitation to paste
# one in. Supply the value however you like — a shell, direnv, a secret
# manager; the declaration only says what to look for.
providers:
  - name: anthropic
    base_url: https://api.anthropic.com/v1
    api_key_env: ANTHROPIC_API_KEY
    max_tokens: 4096

  - name: openai
    base_url: https://api.openai.com/v1
    api_key_env: OPENAI_API_KEY
    max_tokens: 4096

  # One endpoint fronting many families, for when procurement is done by
  # shopping rather than by picking. Cost lives out here, before a pool
  # exists — never in the filter.
  - name: openrouter
    base_url: https://openrouter.ai/api/v1
    api_key_env: OPENROUTER_API_KEY

roles:
  # Rules on whether a proposition is a claim at all, as against signature or
  # rationale. The triage proposes this; only an editor settles it.
  - name: editor
    requires: [reasoning, structured-outputs]

  # Rules on whether a categorical identification is right. The role the 23
  # judgmental propositions of rung-ct-props.md name. Q7, Q9 and Q10 were each
  # settled by a principal in this role, and Q7's ruling overturned the account
  # that preceded it.
  - name: category-theorist
    requires: [reasoning, web-research]

  # Amends a normative document. Authorship, not judgment — it needs standing
  # over the document, and being able to judge it buys nothing here.
  - name: maintainer
    requires: [code-generation, file-editing]

  # ── the questions theory's three roles (rung_std::questions) ──────────────
  # The same capability vocabulary as the doctrine roles above; the driver that
  # fills these is the same one that fills those. They are declared here so the
  # questions pass can be populated without a special case.
  #
  # Authorial: files questions into a status folder, gathers evidence, drafts a
  # resolution, and rewords. It edits, so it needs `file-editing`.
  - name: curator
    requires: [reasoning, file-editing]

  # Judgmental: `is_well_posed` — whether a question is one precise sentence,
  # answerable in principle. Judging well-posedness calls on context beyond the
  # file, so it needs `web-research`.
  - name: interrogator
    requires: [reasoning, web-research]

  # Judgmental: `resolution_answers_the_question` and `survives_the_change`.
  # The ModelOracle reads an exact HOLDS / FAILS / CANNOT-SETTLE form, so this
  # needs `structured-outputs` for the verdict to be readable.
  - name: adjudicator
    requires: [reasoning, structured-outputs]

principals:
  # ── the human ────────────────────────────────────────────────────────────
  #
  # Last in the escalation chain, and the only principal here whose provenance
  # is a genuine record rather than an estimate.
  - id: donald
    kind: human
    capabilities: [reasoning, structured-outputs, web-research, code-generation, file-editing]
    standing: [rung-props.md, rung-het-props.md, rung-ct-props.md, docs]
    authored:
      # Directed the whole corpus. Declared per-document rather than per-slug
      # because that is what is actually known; a finer record would be a
      # guess, and a guess here manufactures admissibility.
      - rung-props.md
      - rung-het-props.md
      - rung-ct-props.md
    backing: {via: outside}

  # ── models ───────────────────────────────────────────────────────────────
  #
  # `authored` is NOT declared here for a model. Q14 ruled that a model's
  # provenance is stake-based, pi(p) = authored(p) ∪ {id(p)}; Q16 ruled that
  # the carrier is a commission contribution record; and Q17 built it. Each
  # model below declares its stable `family` (Q14's family identifier), and the
  # pool derives `authored(p)` from `commissions.yaml` by looking that family
  # up at qualification time. A static `authored` list here would be a second,
  # hand-maintained source of truth — and a growing one — so a model with a
  # `family` must not also declare `authored` (the driver refuses it).
  #
  # The derived set is empty today because `commissions.yaml` records no
  # contributions yet: that is the honest "no commission recorded" state, not
  # the refused per-invocation reading. The moment a commission records what a
  # family produced, that family's models become non-vacuous — they cannot
  # judge those artifacts. Until then nothing is disqualified by fiction.
  #
  # ## Procurement is shopping, and the tiers are deliberate
  #
  # A judgment loop runs over the corpus repeatedly, so cost is a first-class
  # fact of this file, declared *before* the pool exactly where the pool never
  # reads it. The ladder:
  #
  #   default workhorse     deepseek/deepseek-v4-flash-0731   ($0.09 / $0.18)
  #   better reasoning      openai/gpt-5.6-luna-pro           ($0.10 / $0.60)
  #   mix / third family    x-ai/grok-4.5                     ($2.00 / $6.00)
  #   reserved heaviest     anthropic/claude-opus-5           ($5.00 / $25.00)
  #
  # Claude Opus is reserved for the one place max quality is worth its price:
  # the categorical propositions of rung-ct-props.md, whose a ruling may
  # overturn the account (Q7 did). It is not for routine judging.

  # ── the categorical judge — the reserved heaviest lift ────────────────────
  # `category-theorist` fills the 23 judgmental propositions of
  # rung-ct-props.md. These are the rulings that can overturn the account, so
  # this is where Opus's price earns its keep — and nowhere else.
  - id: opus-theorist
    kind: llm
    capabilities: [reasoning, web-research, structured-outputs]
    standing: []
    family: anthropic/claude-opus-5
    backing: {via: model, provider: anthropic, model: claude-opus-5}

  # ── the doctrine judge — better reasoning at low cost ─────────────────────
  # `editor` (is a proposition a claim?) and `adjudicator`. Rationale-tier
  # judgment; Luna Pro's reasoning is enough and its price is a rounding error
  # next to Opus's.
  - id: gpt-judge
    kind: llm
    capabilities: [reasoning, structured-outputs]
    standing: []
    family: openai/gpt-5.6-luna-pro
    backing: {via: model, provider: openai, model: gpt-5.6-luna-pro}

  # ── the categorical mix — a second family for panels ─────────────────────
  # Grok 4.5, deliberately a different family from both Opus and the GPTs, so
  # a two-judge panel spans independent lineages (blind spots are not shared).
  - id: grok-theorist
    kind: llm
    capabilities: [reasoning, web-research]
    standing: []
    family: x-ai/grok-4.5
    backing: {via: model, provider: openrouter, model: x-ai/grok-4.5}

  # ── the doctrine author ──────────────────────────────────────────────────
  #
  # An agent, because enacting an edit means editing files. It holds standing
  # over the doctrine source and NOT over the rendered markdown: the markdown
  # is generated, so writing to it directly would put a change somewhere the
  # next render silently discards. Default-tier workhorse — cheap and fully
  # capable for mechanical editing.
  - id: ds-maintainer
    kind: agent
    capabilities: [reasoning, code-generation, file-editing]
    standing: [rung-doctrine/src]
    family: deepseek/deepseek-v4-flash-0731
    backing:
      via: agent
      provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
      tools: [read, edit, search]

  # ── the questions pass ───────────────────────────────────────────────────
  #
  # Same provenance story as the model principals above: `authored` is derived
  # per family from `commissions.yaml` by lookup, not declared here. The roles
  # are declared so the questions pass can be populated; dispatching
  # meaningfully is now gated on the commission record actually containing
  # contributions (see the comments atop `commissions.yaml`).
  #
  # The curator is an agent — it edits question files, so it needs file-editing,
  # and holds standing over the whole questions tree. DeepSeek family, so a
  # judge from a different family (OpenAI, below) can rule on its work under P0.
  # Reached through the openrouter endpoint (its api_key_env is
  # OPENROUTER_API_KEY), which is how DeepSeek is procured in this setup.
  - id: ds-curator
    kind: agent
    capabilities: [reasoning, file-editing]
    standing: [questions]
    family: deepseek/deepseek-v4-flash-0731
    backing:
      via: agent
      provider: openrouter
      model: deepseek/deepseek-v4-flash-0731
      tools: [read, edit, search]

  # The interrogator judges `is_well_posed`. OpenAI family — deliberately
  # disjoint from the DeepSeek-backed curator, so non-identity (P0) is real
  # rather than decorative. Luna Pro for the reasoning, not the price.
  - id: gpt-interrogator
    kind: llm
    capabilities: [reasoning, web-research]
    standing: []
    family: openai/gpt-5.6-luna-pro
    backing: {via: model, provider: openai, model: gpt-5.6-luna-pro}

  # The adjudicator judges `resolution_answers_the_question` and
  # `survives_the_change`. Same family as the interrogator (they may agree on
  # blind spots — that is what a second *family*, not a second id, buys).
  - id: gpt-adjudicator
    kind: llm
    capabilities: [reasoning, structured-outputs]
    standing: []
    family: openai/gpt-5.6-luna-pro
    backing: {via: model, provider: openai, model: gpt-5.6-luna-pro}
