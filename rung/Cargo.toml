[package]
name = "rung"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "The ladder runtime: declare rungs and transitions once and the compiler refuses any path that skips a rung (re-exports the ladder! macro)"
repository.workspace = true

[dependencies]
rung-macro = { path = "../rung-macro" }

[dev-dependencies]
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
trybuild = "1"
