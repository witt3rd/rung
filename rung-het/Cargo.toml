[package]
name = "rung-het"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Het's gate-marked satisfaction, enforced by the type system"

[dependencies]
rung = { path = "../rung" }

[dev-dependencies]
