[package]
name = "rung-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The HTTP gateway in front of rung hosts: one listener for the UI, any number of instances behind it, the instance keys held here, a read-only token role"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "net", "time", "sync"] }
hyper = { version = "1", features = ["http1", "http2", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2", "client-legacy"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"

[dev-dependencies]
rung-testkit = { path = "../rung-testkit" }
reqwest = { version = "0.12", features = ["json"] }
