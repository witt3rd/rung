[package]
name = "rung-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless composition of rung-std blocks: catalog, sessions, isolation, a task CLI"

[dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_session_fork"] }
rung-std = { path = "../rung-std" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync"] }
