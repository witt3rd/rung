[package]
name = "rung-agent"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless composition of rung-std blocks: catalog, sessions, isolation, a task CLI"

[dependencies]
agent-client-protocol = { version = "2.0.0", features = ["unstable_session_fork"] }
rung-std = { path = "../rung-std" }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "net", "io-util", "time"] }
hyper = { version = "1", features = ["http1", "http2", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "server-auto", "http1", "http2"] }
http-body-util = "0.1"
bytes = "1"
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
