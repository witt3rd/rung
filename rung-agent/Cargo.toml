[package]
name = "rung-agent"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Headless composition of rung-std blocks: catalog, sessions, isolation, a task CLI"
publish = false

[dependencies]
rung-agent-core = { path = "../rung-agent-core" }
rung-memory = { path = "../rung-memory" }
serde_json = "1"

[dev-dependencies]
rung-testkit = { path = "../rung-testkit" }
rung-std = { path = "../rung-std" }
serde = { version = "1", features = ["derive"] }
trybuild = "1"
