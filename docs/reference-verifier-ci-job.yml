  reference-verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # previous tagged release (v0.3.1), pinned by commit hash
      REF_SHA: a8d8fc9434fc0b3d6bb95f468ccb9431917df385
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fetch pinned reference release (hash-checked)
        run: |
          git fetch --no-tags origin "$REF_SHA"
          test "$(git rev-parse "$REF_SHA^{commit}")" = "$REF_SHA"
          git worktree add ../ref "$REF_SHA"
      - name: build reference and candidate
        run: |
          cargo build -q -p rung-agent -p rung-testkit --locked
          (cd ../ref && cargo build -q -p rung-agent -p rung-testkit --target-dir target)
      - name: replay scripted inputs on both and diff
        run: |
          scripts/reference_verifier.py --ref-dir ../ref/target/debug \
            --cand-dir target/debug --expected docs/reference-verifier-expected.json \
            --receipts verifier-receipts | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-receipts
          path: verifier-receipts
