<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" font-family="Noto Sans, Liberation Sans, sans-serif">
<defs>
<marker id="ma" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5163"/></marker>
<marker id="mp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b4bd6"/></marker>
</defs>
<rect x="320" y="110" width="260" height="110" rx="14" fill="#ece9fb" stroke="#5b4bd6" stroke-width="3"/>
<text x="450" y="155" font-size="26" font-weight="700" fill="#1d2433" text-anchor="middle">Free time</text>
<text x="450" y="185" font-size="17" fill="#4a5163" text-anchor="middle">the default · the agent picks</text>
<rect x="640" y="110" width="250" height="110" rx="14" fill="#fff" stroke="#1d2433" stroke-width="2"/>
<text x="765" y="155" font-size="24" font-weight="700" fill="#1d2433" text-anchor="middle">Committed</text>
<text x="765" y="185" font-size="17" fill="#4a5163" text-anchor="middle">its own project, until done</text>
<rect x="10" y="110" width="250" height="110" rx="14" fill="#fff" stroke="#1d2433" stroke-width="2"/>
<text x="135" y="155" font-size="24" font-weight="700" fill="#1d2433" text-anchor="middle">Responding</text>
<text x="135" y="185" font-size="17" fill="#4a5163" text-anchor="middle">to an item let in</text>
<path d="M582 145 L638 145" stroke="#5b4bd6" stroke-width="3" fill="none" marker-end="url(#mp)"/>
<text x="610" y="100" font-size="17" font-weight="700" fill="#5b4bd6" text-anchor="middle">commit</text>
<path d="M638 190 L582 190" stroke="#5b4bd6" stroke-width="3" fill="none" marker-end="url(#mp)"/>
<text x="610" y="245" font-size="17" font-weight="700" fill="#5b4bd6" text-anchor="middle">release</text>
<path d="M318 145 L262 145" stroke="#4a5163" stroke-width="3" fill="none" marker-end="url(#ma)"/>
<path d="M262 190 L318 190" stroke="#4a5163" stroke-width="3" fill="none" marker-end="url(#ma)"/>
<text x="290" y="100" font-size="16" fill="#4a5163" text-anchor="middle">interrupt</text>
<text x="290" y="245" font-size="16" fill="#4a5163" text-anchor="middle">back</text>
<path d="M765 108 C765 30 135 30 135 108" stroke="#4a5163" stroke-width="2.5" stroke-dasharray="8 6" fill="none" marker-end="url(#ma)"/>
<text x="450" y="40" font-size="16" fill="#4a5163" text-anchor="middle">interrupt, then back to the same project</text>
<text x="450" y="300" font-size="17" fill="#4a5163" text-anchor="middle">Only the agent commits or releases. Jev decides only whether an item interrupts.</text>
</svg>
