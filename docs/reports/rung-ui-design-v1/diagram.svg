<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1680 470" width="1680" height="470" font-family="Noto Sans, Liberation Sans, sans-serif">
<defs>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#4a5163"/></marker>
<marker id="arp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b4bd6"/></marker>
</defs>
<!-- browser -->
<rect x="20" y="120" width="290" height="210" rx="12" fill="#fff" stroke="#1d2433" stroke-width="2"/>
<text x="40" y="158" font-size="23" font-weight="700" fill="#1d2433">The browser</text>
<g font-size="18" fill="#4a5163"><text x="40" y="190">phone or desktop</text><text x="40" y="214">the rung-ui app:</text><text x="40" y="238">overview, one instance,</text><text x="40" y="262">queue, configure, observe</text><text x="40" y="294" font-weight="700" fill="#1d2433">no tokens in the page</text></g>
<!-- gateway -->
<rect x="440" y="120" width="330" height="210" rx="12" fill="#ece9fb" stroke="#5b4bd6" stroke-width="2"/>
<text x="460" y="158" font-size="23" font-weight="700" fill="#1d2433">The gateway</text>
<text x="460" y="182" font-size="17" fill="#5b4bd6" font-weight="700">rung-ui serve · new</text>
<g font-size="18" fill="#4a5163"><text x="460" y="214">serves the app files</text><text x="460" y="238">holds each instance's key</text><text x="460" y="262">passes /v1 through, streams too</text><text x="460" y="286">polls every instance's summary</text><text x="460" y="310">for the overview</text></g>
<!-- registry -->
<rect x="440" y="372" width="330" height="80" rx="12" fill="#fff" stroke="#5b4bd6" stroke-width="2" stroke-dasharray="6 5"/>
<text x="460" y="402" font-size="21" font-weight="700" fill="#1d2433">Instance registry · new</text>
<text x="460" y="430" font-size="17" fill="#4a5163">one small file per instance</text>
<!-- hosts -->
<g>
<rect x="910" y="20" width="420" height="120" rx="12" fill="#e3f4ec" stroke="#2e9e6b" stroke-width="2"/>
<text x="930" y="52" font-size="23" font-weight="700" fill="#1d2433">Instance: atlas</text>
<g font-size="17" fill="#4a5163"><text x="930" y="80">rung-host · its own state, workspace,</text><text x="930" y="102">inbox, stop file, port · a lock on its state</text><text x="930" y="124" fill="#5b4bd6" font-weight="700">Host API /v1 · new</text></g>
<rect x="910" y="165" width="420" height="120" rx="12" fill="#e3f4ec" stroke="#2e9e6b" stroke-width="2"/>
<text x="930" y="197" font-size="23" font-weight="700" fill="#1d2433">Instance: bramble</text>
<g font-size="17" fill="#4a5163"><text x="930" y="225">the same host, a second process</text><text x="930" y="247">nothing shared but the machine</text><text x="930" y="269" fill="#5b4bd6" font-weight="700">Host API /v1 · new</text></g>
<rect x="910" y="310" width="420" height="120" rx="12" fill="#e3f4ec" stroke="#2e9e6b" stroke-width="2"/>
<text x="930" y="342" font-size="23" font-weight="700" fill="#1d2433">Instance: cedar</text>
<g font-size="17" fill="#4a5163"><text x="930" y="370">the same host, a third process</text><text x="930" y="392">its own record is its own truth</text><text x="930" y="414" fill="#5b4bd6" font-weight="700">Host API /v1 · new</text></g>
</g>
<!-- disk -->
<rect x="1400" y="120" width="260" height="210" rx="12" fill="#fff" stroke="#dcd9d0" stroke-width="2"/>
<text x="1420" y="158" font-size="21" font-weight="700" fill="#1d2433">On disk, per instance</text>
<g font-size="17" fill="#4a5163"><text x="1420" y="190">the record (exists)</text><text x="1420" y="214">console log · new</text><text x="1420" y="238">state-dir lock · new</text><text x="1420" y="262">config overrides · new</text><text x="1420" y="294" font-weight="700" fill="#1d2433">the record stays the truth</text></g>
<!-- arrows -->
<path d="M312 225 L438 225" stroke="#5b4bd6" stroke-width="3" fill="none" marker-end="url(#arp)"/>
<text x="326" y="210" font-size="16" fill="#5b4bd6" font-weight="700">https</text>
<path d="M772 190 L908 85" stroke="#5b4bd6" stroke-width="3" fill="none" marker-end="url(#arp)"/>
<path d="M772 225 L908 225" stroke="#5b4bd6" stroke-width="3" fill="none" marker-end="url(#arp)"/>
<path d="M772 262 L908 368" stroke="#5b4bd6" stroke-width="3" fill="none" marker-end="url(#arp)"/>
<path d="M605 372 L605 332" stroke="#4a5163" stroke-width="3" fill="none" marker-end="url(#ar)"/>
<path d="M1332 225 L1398 225" stroke="#4a5163" stroke-width="3" fill="none" marker-end="url(#ar)"/>
</svg>
