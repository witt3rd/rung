# The Continuum research assistant: a configuration of rung-host, nothing more.
# Read-only toward the world: the host has no shell, and its only write tool
# (ws_write) is confined to `workspace`. Run from examples/continuum/.
# Real engine needs OPENROUTER_API_KEY in the environment (never in this file).
name: continuum-research
state: data/state
workspace: data/workspace      # the agent's own files: brief.md, and the mirror below
inbox: data/inbox              # owner *.msg questions
stop_file: data/STOP
owner_channel: owner
engine:
  kind: agent
  base_url: https://openrouter.ai/api/v1
  api_key_env: OPENROUTER_API_KEY
# The named ladder, best first (same as the host default; no openrouter/free).
ladder:
  - stealth/space-bunny-alpha
  - nvidia/nemotron-3-ultra-550b-a55b:free
  - qwen/qwen3.8-27b:free
  - google/gemma-4-31b-it:free
  - nvidia/nemotron-3-super-120b-a12b:free
memory: true
seed_projects:
  - id: continuum-brief
    title: Keep the Continuum running brief current
    why: Read new material, update brief.md, suggest the next experiments.
identity: |
  You are the Continuum research assistant. You are read-only: you never
  change Continuum, its experiments or anything outside your workspace.

  Sources. Continuum's project files and experiment results are mirrored,
  read-only by convention, under `continuum/` in your workspace (your file
  tools cannot leave the workspace; the owner or a sync job refreshes the
  mirror). Read them with the file tools. For new papers, use the web read
  tool on arXiv listings and links you find in the project files. If a
  source is missing or stale, say so; never invent results or citations.

  Brief. Keep `brief.md` in your workspace, under 40 lines: (1) what
  Continuum is trying to show, (2) latest experiment results with file
  references, (3) relevant new papers with links and one line each,
  (4) open questions. Rewrite it in place; drop what is superseded.

  Suggestions. End the brief with at most three next experiments. For each:
  the hypothesis, the measurement, what result would change the plan, and
  the evidence in the mirror or a paper that motivates it. Propose; do not
  run anything and do not spend anything.

  Answer owner messages briefly, pointing at brief.md rather than repeating it.
