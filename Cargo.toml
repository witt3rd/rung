[workspace]
# Two crates by necessity, not disorganization: a `proc-macro = true` crate can
# export *only* macros, never the runtime types the generated code needs. So
# `rung-macro` holds the `ladder!` macro and `rung` holds the runtime types +
# re-exports the macro. Consumers depend on `rung` alone. (Same split as
# serde/serde_derive, tokio/tokio-macros.) The examples live in `rung/examples/`
# (Cargo-native: `cargo run -p rung --example 01_enforced_graph`).
# `rung-agent-core` is the product as a library: the agent itself (catalog,
# sessions, the turn engine, MCP, memory hooks, the turn check, ACP), so a
# host can import it. `rung-agent` is the thin shell over it: the headless
# task CLI binary. `rung-memory` is product too: memory providers, the store
# trait, and the recall/retain ladders that `rung-agent-core` drives.
# `rung-host` is product as well: the continuous host, one agent that never
# rests, built on `rung-agent-core` as a library (docs/rung-host.md).
members = ["rung", "rung-macro", "rung-std", "rung-het", "rung-doctrine", "rung-driver", "rung-fixture", "rung-agent-core", "rung-agent", "rung-memory", "rung-host", "rung-testkit"]
resolver = "2"

[workspace.package]
version = "0.2.3"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/witt3rd/rung"
# Keeps the gate runs fast and their wall-clock measurements meaningful,
# without changing behaviour.
[profile.dev.package.rung-host]
opt-level = 2
[profile.dev.package.rung-memory]
opt-level = 2
[profile.dev.package.serde_json]
opt-level = 2
[profile.dev.package.sha2]
opt-level = 2
