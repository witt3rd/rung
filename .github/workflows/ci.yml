name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: test (and leave nothing in the temp root)
        run: scripts/test_tmp_clean.sh
      - name: doctests (explicit; library doctests incl. README)
        run: cargo test --workspace --doc --locked
      - name: examples build
        run: cargo build --workspace --examples --locked
      - name: examples run (no config, no network)
        run: |
          for e in 01_enforced_graph 02_terminating_loops 03_failure_edges 04_nondeterminism; do
            cargo run -q -p rung --example "$e" --locked >/dev/null
          done
      - name: example agents (mock engine, no key)
        run: |
          cargo build -q -p rung-agent -p rung-host -p rung-testkit --locked
          examples/notes/run.sh
          examples/reminders/run.sh

  propositions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: generated documents match their encoding
        run: cargo run -q -p rung-doctrine --bin render -- --check
      - name: proposition numbering and references
        run: docs/_props.py check
      - name: proposition citations in Rust source
        run: docs/_props.py cited
      - name: no consumer-specific names (one-way rule)
        run: docs/_consumer_guard.py

  # Verification only: this job never publishes (no cargo publish, no token).
  release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Cargo.lock is current
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: tag matches workspace version; publish=false crates are marked
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docs/_release_check.py "${GITHUB_REF_NAME}"
          else
            docs/_release_check.py
          fi
      - name: release build of rung-agent
        run: cargo build -p rung-agent --release --locked

  # The declared MSRV (`rust-version` in Cargo.toml, set by the newest
  # dependency floor). Compiles every target and runs unit tests there.
  # trybuild `.stderr` files pin the *stable* compiler's wording and drift
  # across rustc releases, so the UI suites run only in `check`.
  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
      - name: build every target
        run: cargo check --workspace --all-targets --locked
      - name: unit tests
        run: cargo test --workspace --lib --bins --locked

  reference-verifier:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # previous tagged release (v0.3.1), pinned by commit hash
      REF_SHA: a8d8fc9434fc0b3d6bb95f468ccb9431917df385
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: fetch pinned reference release (hash-checked)
        run: |
          git fetch --no-tags origin "$REF_SHA"
          test "$(git rev-parse "$REF_SHA^{commit}")" = "$REF_SHA"
          git worktree add ../ref "$REF_SHA"
      - name: build reference and candidate
        run: |
          cargo build -q -p rung-agent -p rung-testkit --locked
          (cd ../ref && cargo build -q -p rung-agent -p rung-testkit --target-dir target)
      - name: replay scripted inputs on both and diff
        run: |
          scripts/reference_verifier.py --ref-dir ../ref/target/debug \
            --cand-dir target/debug --expected docs/reference-verifier-expected.json \
            --receipts verifier-receipts | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verifier-receipts
          path: verifier-receipts
