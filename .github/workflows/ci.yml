# Tier 1: the fast gate, on every push to master and nothing else (no pull requests: work lands through
# scripts/land-direct, which runs this same scripts/tier1.sh locally before it pushes). The `tier1` job of
# master's latest push run IS the definition of red (scripts/land-direct). The slow suites are Tier 2
# (tier2.yml: every six hours and on demand) and never gate landing.
name: CI

on:
  push:
    branches: [master]
  workflow_dispatch:

# A newer push supersedes the run of the one before it (the newest commit contains it).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panic locations and backtraces; full debuginfo only
  # slows the compile and link and bloats the cache. Nothing here debugs.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  tier1:
    # `runs-on` moves to [self-hosted, fleet] once the fleet runner is live; until then GitHub's runner.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tier1
      - name: Tier 1 (the changed crates of this push, or everything on a manual run)
        env:
          # The commit before this push; a manual run has none, and an unreachable base means the whole workspace.
          TIER1_BASE: ${{ github.event.before || 'none' }}
        run: scripts/tier1.sh
