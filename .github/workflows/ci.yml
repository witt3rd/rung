name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
  merge_group:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Line tables keep panic locations and backtraces; full debuginfo only
  # slows the compile and link and bloats the cache. Nothing here debugs.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  # What does this change touch? Pull requests build and test only the
  # affected crates (changed crates plus their reverse dependencies); every
  # other event (push to master, merge_group, tags) runs the full suite.
  # Rules and tests: scripts/ci_plan.py, scripts/test_ci_plan.py.
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      full: ${{ steps.plan.outputs.full }}
      rust: ${{ steps.plan.outputs.rust }}
      scope: ${{ steps.plan.outputs.scope }}
      rung: ${{ steps.plan.outputs.rung }}
      agents: ${{ steps.plan.outputs.agents }}
      gui: ${{ steps.plan.outputs.gui }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: planner tests
        run: python3 scripts/test_ci_plan.py
      - name: plan
        id: plan
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          scripts/ci_plan.py --event "$EVENT" ${BASE:+--base "$BASE" --head "$HEAD"} | tee plan.out
          cat plan.out >> "$GITHUB_OUTPUT"
          {
            echo '### CI plan'
            echo '```'
            cat plan.out
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Formatting and strict clippy. fmt and the records guard are cheap and
  # run on every change; clippy runs on the affected crates.
  lint:
    needs: plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: lint
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: records are append-only
        env:
          BASE_REF: ${{ github.base_ref || 'master' }}
        run: docs/_records_guard.py "origin/$BASE_REF"
      - name: fmt
        run: cargo fmt --check
      - name: skipped tests are visible, expected gates are present
        run: |
          python3 scripts/test_skipped_tests.py
          scripts/skipped_tests.py
      - name: clippy
        if: needs.plan.outputs.rust == 'true'
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          # SCOPE is a list of -p flags: split on purpose
          # shellcheck disable=SC2086
          cargo clippy $SCOPE --all-targets --locked -- -D warnings

  # Tests, sharded across runners with cargo-nextest. nextest lists every
  # test across all test binaries and `--partition count:i/N` deals them out
  # round-robin, so the few slow tests in one binary (rung-host's gate_time)
  # land on different shards instead of one runner serialising the binary.
  # Every shard compiles the test binaries (rust-cache makes that cheap on a
  # warm cache) and runs about 1/N of the tests.
  test:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/master' && matrix.shard == 1 }}
      - uses: taiki-e/install-action@v2
        with:
          tool: nextest
      - name: test shard ${{ matrix.shard }}/4 (and leave nothing in the temp root)
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          # SCOPE is a list of -p flags: split on purpose
          # shellcheck disable=SC2086
          scripts/test_tmp_clean.sh nextest --locked $SCOPE \
            --partition "count:${{ matrix.shard }}/4" --no-tests=pass

  # rustdoc and the doctests nextest does not run (library doctests, incl. the Getting Started example in rung/src/lib.rs).
  docs:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: rustdoc
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
          RUSTDOCFLAGS: -D warnings
        run: |
          # SCOPE is a list of -p flags: split on purpose
          # shellcheck disable=SC2086
          cargo doc $SCOPE --no-deps --locked
      - name: doctests
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          # SCOPE is a list of -p flags: split on purpose
          # shellcheck disable=SC2086
          cargo test $SCOPE --doc --locked

  examples:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: examples
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: examples build
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          # SCOPE is a list of -p flags: split on purpose
          # shellcheck disable=SC2086
          cargo build $SCOPE --examples --locked
      - name: examples run (no config, no network)
        if: needs.plan.outputs.rung == 'true'
        run: |
          for e in 01_enforced_graph 02_terminating_loops 03_failure_edges 04_nondeterminism; do
            cargo run -q -p rung --example "$e" --locked >/dev/null
          done
      - name: example agents (mock engine, no key)
        if: needs.plan.outputs.agents == 'true'
        run: |
          cargo build -q -p rung-agent -p rung-host -p rung-testkit --locked
          examples/notes/run.sh
          examples/reminders/run.sh

  # The GUI workspace (`gui/`: the typed gateway client and the desktop app).
  # Its own cargo root, outside the main workspace, and deliberately NOT in
  # `check`'s needs: GPUI is slow to build, and the required status must stay
  # fast. It runs when `gui/` changes or when the gateway or host (whose real
  # binaries its tests start) is in scope, and always on master and the merge
  # group. One shared cache for both workspaces; only master saves it.
  gui:
    needs: plan
    if: needs.plan.outputs.gui == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      RUNG_BIN_DIR: ${{ github.workspace }}/target/debug
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: gui
          workspaces: |
            . -> target
            gui -> target
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: the real binaries the client tests start
        run: cargo build -p rung-gateway -p rung-host --locked
      - name: fmt
        working-directory: gui
        run: cargo fmt --check
      - name: clippy
        working-directory: gui
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: test
        working-directory: gui
        run: cargo test --workspace --locked

  # The one required status. Its name never changes: branch protection and the
  # merge queue name `check`. It passes only when every job above passed; a
  # job may be skipped only when the plan found no Rust input to build.
  check:
    if: always()
    needs: [plan, lint, test, docs, examples, msrv, deny, propositions, release-check]
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: every job passed (skips allowed only when the plan skipped them)
        env:
          NEEDS: ${{ toJSON(needs) }}
          RUST: ${{ needs.plan.outputs.rust }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          bad=0
          for job in $(echo "$NEEDS" | jq -r 'keys[]'); do
            result=$(echo "$NEEDS" | jq -r --arg j "$job" '.[$j].result')
            case "$result" in
              success) ;;
              skipped)
                case "$job" in
                  test|docs|examples|msrv)
                    [ "$RUST" = false ] || { echo "::error::$job was skipped but the plan has Rust work"; bad=1; } ;;
                  *) echo "::error::$job was skipped"; bad=1 ;;
                esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done
          exit "$bad"

  deny:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources

  propositions:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: generated documents match their encoding
        run: cargo run -q -p rung-doctrine --bin render -- --check
      - name: proposition numbering and references
        run: docs/_props.py check
      - name: proposition citations in Rust source
        run: docs/_props.py cited
      - name: no consumer-specific names (one-way rule)
        run: docs/_consumer_guard.py
      - name: links, anchors, cited paths (self-test, then the guard)
        run: |
          python3 scripts/test_links.py
          docs/_links.py

  # Verification only: this job never publishes (no cargo publish, no token).
  release-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: Cargo.lock is current
        run: cargo metadata --locked --format-version 1 >/dev/null
      - name: tag matches workspace version; publish=false crates are marked
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            docs/_release_check.py "${GITHUB_REF_NAME}"
          else
            docs/_release_check.py
          fi
      - name: release build of rung-agent
        run: cargo build -p rung-agent --release --locked

  # The declared MSRV (`rust-version` in Cargo.toml, set by the newest
  # dependency floor). Compiles every target and runs unit tests there.
  # trybuild `.stderr` files pin the *stable* compiler's wording and drift
  # across rustc releases, so the UI suites run only in `test`.
  msrv:
    needs: plan
    if: needs.plan.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv
          save-if: ${{ github.ref == 'refs/heads/master' }}
      - name: build every target
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          # SCOPE is a list of -p flags: split on purpose
          # shellcheck disable=SC2086
          cargo check $SCOPE --all-targets --locked
      - name: unit tests
        env:
          SCOPE: ${{ needs.plan.outputs.scope }}
        run: |
          # SCOPE is a list of -p flags: split on purpose
          # shellcheck disable=SC2086
          cargo test $SCOPE --lib --bins --locked
