name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: rustdoc
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: test
        run: cargo test --workspace --locked
      - name: doctests (explicit; library doctests incl. README)
        run: cargo test --workspace --doc --locked
      - name: examples build
        run: cargo build --workspace --examples --locked
      - name: examples run (no config, no network)
        run: |
          for e in 01_enforced_graph 02_terminating_loops 03_failure_edges 04_nondeterminism; do
            cargo run -q -p rung --example "$e" --locked >/dev/null
          done

  propositions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: generated documents match their encoding
        run: cargo run -q -p rung-doctrine --bin render -- --check
      - name: proposition numbering and references
        run: docs/_props.py check
      - name: proposition citations in Rust source
        run: docs/_props.py cited
      - name: no consumer-specific names (one-way rule)
        run: docs/_consumer_guard.py
