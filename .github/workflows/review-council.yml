# The review council, post-merge and advisory. Rung lands straight to master (scripts/land-direct), so there
# is no pull request to review: once a day, and on request, scripts/post_merge_review.py reads what landed
# since the last review, against AGENTS.md and .github/review-council/principles.md, and files an issue for
# each BLOCK or FIX finding. It blocks nothing and never runs on a push. The key is this repo's OPENROUTER_API_KEY secret.
# On request: Actions > Review council > Run workflow, with an optional range (e.g. abc123..def456).
name: Review council

on:
  schedule:
    - cron: '41 5 * * *'
  workflow_dispatch:
    inputs:
      range:
        description: 'Commit range to review (default: everything since the last review)'
        required: false
        default: ''

permissions:
  contents: read
  issues: write

concurrency:
  group: review-council
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: review what landed
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          RANGE: ${{ inputs.range }}
        run: scripts/post_merge_review.py ${RANGE:+--range "$RANGE"}
